<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/src/shared/ui/tokens/tokens.css" />
    <link rel="stylesheet" href="/src/shared/ui/tokens/base.css" />
    <title>Flyer Galicia 5.5</title>
    <!-- The look is known before the first paint: without this, dark mode opens in a flash of light. -->
    <script>
      try {
        var root = document.documentElement;
        var palette = localStorage.getItem("fg_palette");
        if (localStorage.getItem("fg_theme") === "dark") root.classList.add("dark");
        root.classList.add(/^t-(marfil|marino|grafito|cielo)$/.test(palette || "") ? palette : "t-marfil");
      } catch (error) {
        document.documentElement.classList.add("t-marfil");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
